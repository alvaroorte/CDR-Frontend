<p-dialog
  [visible]="openModal()"
  [modal]="true"
  [closable]="false"
  [closeOnEscape]="false"
  [dismissableMask]="false"
  [header]="appName"
  styleClass="w-10 md:w-6 lg:w-4"
  appendTo="body">
  <div class="flex flex-column align-items-center text-center gap-4 p-2 pb-4">
    <i class="pi pi-tablet" style="font-size: 2.5rem"></i>
    <span>
      Este sistema está diseñado para <strong>tablets y computadoras</strong>.
      Por favor, ingrese desde uno de esos dispositivos.
    </span>
  </div>
</p-dialog>
