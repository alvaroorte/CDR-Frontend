<div class="container mx-3 mb-0 pb-4">
  <p-fieldset styleClass="sombra-black">
    <ng-template #header>
      <div class="flex align-items-center text-primary fadeinleft animation-duration-400">
        <h1 class="text-white text-2xl">{{ labels.home }} <span class="text-sm"> Bienvenido al sistema</span></h1>
      </div>
    </ng-template>
    <div class="grid">
      <div class="col-12 fadeindown animation-duration-400">
        <div class="sombra-black border-round-xl p-4 surface-0">
          <h2 class="mt-0 lynch-900">Hola, {{ loginService.fullName() }}</h2>
          <p class="lynch-700 text-lg">
            Has ingresado como
            @for (role of roleLabels(); track role; let last = $last) {
              <p-tag [value]="role" severity="info" class="mx-1" />
            }
          </p>
          <p class="lynch-600">
            Las pantallas de pedidos, cocina, caja y administración se habilitarán en las próximas etapas.
          </p>
        </div>
      </div>
    </div>
  </p-fieldset>
</div>
