<p-dialog [focusOnShow]="false" [(visible)]="openModal" styleClass="w-11 md:w-6 lg:w-4"
  [header]="'Cancelar pedido ' + (target()?.codeLabel ?? '')" [modal]="true" appendTo="body" [closable]="!saving()">
  <form [formGroup]="formCancel" (ngSubmit)="submit()">
    @if (target(); as t) {
      <p-message severity="warn" styleClass="w-full mb-4"
        [text]="'Se devolverán ' + (t.total | currencyBs) + ' desde su caja abierta.'" />
    }
    <p-floatlabel class="mt-3">
      <textarea pTextarea id="cancelReason" formControlName="reason" rows="3" class="w-full" maxlength="255"></textarea>
      <label for="cancelReason" class="text-lg font-bold text-800 required-field">Motivo de la cancelación</label>
    </p-floatlabel>
    @if (formCancel.controls.reason.touched && formCancel.controls.reason.hasError('required')) {
      <small class="p-error block mt-2">{{ messages.requiredField }}</small>
    }
    @if (formCancel.controls.reason.hasError('noSpace')) {
      <small class="p-error block mt-2">{{ messages.noOnlySpace }}</small>
    }
    <div class="flex justify-content-end gap-2 mt-4">
      <p-button label="Volver" severity="secondary" [rounded]="true" [outlined]="true" [disabled]="saving()" (click)="close()" />
      <p-button type="submit" label="Cancelar pedido" icon="pi pi-times" severity="danger" [rounded]="true" [loading]="saving()" />
    </div>
  </form>
</p-dialog>
