<div class="container mx-3 mb-0 pb-4">
  <p-fieldset styleClass="sombra-black">
    <ng-template pTemplate="header">
      <div class="flex align-items-center text-primary fadeinleft animation-duration-400">
        <h1 class="text-white text-2xl">Números de mesa <span class="text-sm"> Adornos numerados que se entregan al cliente</span> </h1>
      </div>
    </ng-template>
    <div class="grid">
      <div class="col-12 fadeindown animation-duration-400">
        <div class="sombra-black border-round-xl p-2 surface-0">
          <app-toolbar-common
            tooltipCreate="Crear número de mesa"
            tooltipDelete="Desactivar número de mesa"
            iconDelete="pi-ban"
            [serviceGeneric]="tableMarkerService"
            [object]="tableMarkerSelected()"/>
          <app-modal-form />
          <app-modal-delete [serviceGeneric]="tableMarkerService"
            [objectId]="tableMarkerSelected()?.id" />
          <app-generic-table [titleTable]="titleTable"
            [items]="tableMarkers()"
            [tableColumnDefinitions]="tableColumnTableMarkerDefinitions"
            (onSelection)="setTableMarker($event)"
            (requestData)="getTableMarkers()"
            (selfEmitter)="onTableSelfEmision($event)"
           />
        </div>
      </div>
    </div>
  </p-fieldset>
</div>
