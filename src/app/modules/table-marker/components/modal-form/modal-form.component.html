<form [formGroup]="formTableMarker">
  <div class="grid">
    <div class="col-12">
      <p-dialog [focusOnShow]="false" [(visible)]="openModal" styleClass="w-10 md:w-6 lg:w-4" [header]="titleForm" [modal]="true" class="p-fluid" appendTo="body">
        <ng-template pTemplate="content">

          <app-message-required-field />

          <div class="form-group field mt-5">
            <p-floatlabel>
              <p-inputnumber inputId="number" formControlName="number" [useGrouping]="false" [min]="1" [max]="999" class="w-full" />
              <label for="number" class="text-lg font-bold text-800 required-field"> {{ labels.number }} </label>
            </p-floatlabel>
            @if (formTableMarker.controls.number.touched && formTableMarker.controls.number.hasError('required')) {
              <small class="p-error block mt-2">{{ messages.requiredField }}</small>
            }
          </div>

          <div class="form-group field mt-5">
            <p-floatlabel>
              <input type="text" pInputText id="description" formControlName="description" class="w-full" />
              <label htmlFor="description" class="text-lg font-bold text-800"> {{ labels.description }} </label>
            </p-floatlabel>
            @if (formTableMarker.controls.description.hasError('maxlength')) {
              <small class="p-error block mt-2">{{ messages.maxNumberField(255) }}</small>
            }
          </div>

          <div class="form-group field mt-4 flex align-items-center gap-2">
            <p-toggleswitch inputId="active" formControlName="active" />
            <label for="active" class="text-lg font-bold text-800"> {{ labels.active }} </label>
          </div>

        </ng-template>
        <ng-template pTemplate="footer">
          <div class="p-2 pb-3">
            <input type="hidden" pInputText id="id" formControlName="id"/>
            <button type="button" pButton pRipple [label]="labels.cancel" icon="pi pi-times" severity="secondary"
              [rounded]="true" size="small" class="mr-2 shadow-3" (click)="hideModal()"></button>
            <button type="button" pButton pRipple [label]="labels.save" icon="pi pi-check" [rounded]="true"
              size="small" class="mr-2 shadow-3 hover-primary" (click)="save()" [disabled]="formTableMarker.invalid"></button>
          </div>
        </ng-template>
      </p-dialog>
    </div>
  </div>
</form>
